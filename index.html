<!doctype html>
<html lang="en" data-theme="dark" data-style="glass" data-layout="sidebar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Lead Finder</title>
    <!-- Apply the saved theme / style / layout before first paint so the page never flashes
         the wrong look. Keep keys and allowed values in sync with src/app/appearance.tsx -->
    <script>
      (function () {
        var d = document.documentElement;
        var theme = 'dark', style = 'glass', layout = 'sidebar';
        try {
          var t = localStorage.getItem('vb.theme');
          if (t === 'light' || t === 'dark') theme = t;
          else if (t === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var s = localStorage.getItem('vb.uiStyle');
          if (s === 'classic' || s === 'glass' || s === 'tactile') style = s;
          var l = localStorage.getItem('vb.uiLayout');
          if (l === 'sidebar' || l === 'rail' || l === 'topbar') layout = l;
        } catch (e) {}
        d.setAttribute('data-theme', theme);
        d.setAttribute('data-style', style);
        d.setAttribute('data-layout', layout);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
